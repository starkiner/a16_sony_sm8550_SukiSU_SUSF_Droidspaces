name: Release

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'SukiSU'
        type: choice
        options:
          - SukiSU
          - ReSukiSU
      enable_susfs:
        description: 'Enable SUSFS'
        required: true
        default: true
        type: boolean
      enable_kpm:
        description: 'Enable KPM (Kernel Patch Module)'
        required: true
        default: true
        type: boolean
      enable_zram:
        description: 'Enable ZRAM optimizations (LZ4KD)'
        required: true
        default: true
        type: boolean
      droidspaces:
        description: 'Droidspaces container support (experimental)'
        required: true
        default: '678'
        type: choice
        options:
          - off
          - 678
          - 123
          - 345
      droidspaces_ntsync:
        description: 'Enable Droidspaces NTSync support (requires Droidspaces)'
        required: true
        default: false
        type: boolean
      release_version:
        description: 'Release Version'
        required: true
        default: 'v2.0.0-r1'
        type: string

env:
  AOSP_TOOLCHAIN_BRANCH: android16
  AOSP_CLANG_VERSION: r547379
  KERNEL_LOCALVERSION: spacealtctrl-sukisu
  ANDROID_VERSION: android13
  KERNEL_VERSION: 5.15
  SUSFS_RESUKISU_PIN: e4bd49f708108cc829fe7ca079312ea8fefa89f8
  RESUKISU_PIN: a13d71f699093f0c1da7ba442881eccaa8e4321a

jobs:
  build:
    name: Build ${{ matrix.device }}
    permissions: { contents: write }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_SLUG: ${{ github.event.inputs.ksu_variant == 'ReSukiSU' && 'resukisu' || 'sukisu' }}
    strategy:
      matrix:
        device: [pdx234]
      fail-fast: false
    steps:
      - name: Maximize Build Space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          remove-cached-tools: 'false'
          verbose: 'true'

      - name: Install packages
        env:
          PACKAGES:
            binutils-arm-linux-gnueabi
            binutils-aarch64-linux-gnu
            ccache
            libelf-dev
            libssl-dev
            bc
            bison
            flex
            python3
            python-is-python3
            dwarves
            build-essential
            libc6-dev
            curl
            git
            zip
            unzip
            pigz
        run: |
          echo 'Acquire::Queue-Mode "host";' | sudo tee /etc/apt/apt.conf.d/99parallel
          echo 'Acquire::http::Pipeline-Depth "5";' | sudo tee -a /etc/apt/apt.conf.d/99parallel
          sudo apt update -qq
          sudo apt install -y ${{ env.PACKAGES }} -qq

      - name: Initialize error log
        run: |
          echo "=== Build Process Error and Warning Log ===" > error-log-${{ matrix.device }}.txt
          echo "Build started: $(date -u)" >> error-log-${{ matrix.device }}.txt
          echo "Device: ${{ matrix.device }}" >> error-log-${{ matrix.device }}.txt
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Checkout build configs
        uses: actions/checkout@v4
        with:
          path: build-configs

      - name: Sync kernel repository
        uses: actions/checkout@v4
        with:
          repository: lineageos/android_kernel_sony_sm8550
          ref: lineage-23.2
          path: kernel
          fetch-depth: 1

      - name: Clean kernel build environment
        working-directory: kernel
        run: |
          echo "Cleaning kernel build environment..." | tee -a ../error-log-${{ matrix.device }}.txt
          make mrproper 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt
          echo "✓ Kernel environment cleaned" | tee -a ../error-log-${{ matrix.device }}.txt
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Install base defconfig from extracted boot.img config
        working-directory: kernel
        run: |
          echo "--- Installing Base Defconfig ---" | tee -a ../error-log-${{ matrix.device }}.txt
          STOCK_DEFCONFIG="../build-configs/${{ matrix.device }}_defconfig"
          if [ ! -f "$STOCK_DEFCONFIG" ]; then
            echo "✗ ERROR: Extracted defconfig not found: $STOCK_DEFCONFIG" | tee -a ../error-log-${{ matrix.device }}.txt
            exit 1
          fi
          cp "$STOCK_DEFCONFIG" arch/arm64/configs/${{ matrix.device }}_defconfig
          echo "✓ Installed stock defconfig ($(wc -l < arch/arm64/configs/${{ matrix.device }}_defconfig) lines)" | tee -a ../error-log-${{ matrix.device }}.txt
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang..." | tee -a error-log-${{ matrix.device }}.txt
          mkdir -p clang &&
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" |
          tar xz -C clang
          echo "✓ Clang downloaded and extracted" | tee -a error-log-${{ matrix.device }}.txt
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ matrix.device }}-sukisu
          restore-keys: kernel-${{ matrix.device }}-sukisu
          max-size: 3G
          save: true

      - name: Setup swap
        run: |
          echo "Setting up swap..." | tee -a error-log-${{ matrix.device }}.txt
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon -s
          echo "✓ Swap configured" | tee -a error-log-${{ matrix.device }}.txt
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Clone SukiSU and SUSFS dependencies
        run: |
          echo "--- Cloning Dependencies ---" | tee -a error-log-${{ matrix.device }}.txt
          echo "Cloning SukiSU and SUSFS dependencies in parallel..."

          SUSFS_BRANCH="gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          echo "Using SUSFS branch: $SUSFS_BRANCH" | tee -a error-log-${{ matrix.device }}.txt

          if [ "${{ github.event.inputs.ksu_variant }}" == "SukiSU" ]; then
            if ! git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>&1 | tee -a error-log-${{ matrix.device }}.txt; then
              echo "ShirkNeko susfs4ksu missing branch $SUSFS_BRANCH, falling back to simonpunk" | tee -a error-log-${{ matrix.device }}.txt
              rm -rf susfs4ksu
              git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" 2>&1 | tee -a error-log-${{ matrix.device }}.txt
            fi
          else
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" 2>&1 | tee -a error-log-${{ matrix.device }}.txt
            git -C susfs4ksu checkout "${{ env.SUSFS_RESUKISU_PIN }}" 2>&1 | tee -a error-log-${{ matrix.device }}.txt
            echo "Pinned SUSFS to ${{ env.SUSFS_RESUKISU_PIN }} (last commit before fake_status sync; ReSukiSU main lacks that glue)" | tee -a error-log-${{ matrix.device }}.txt
          fi

          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git 2>&1 | tee -a error-log-${{ matrix.device }}.txt &

          git clone https://github.com/ShirkNeko/SukiSU_patch.git 2>&1 | tee -a error-log-${{ matrix.device }}.txt &

          git clone --depth=1 https://github.com/zzh20188/GKI_KernelSU_SUSFS.git zzh_patches 2>&1 | tee -a error-log-${{ matrix.device }}.txt &
          wait
          echo "✓ Dependencies cloned successfully" | tee -a error-log-${{ matrix.device }}.txt

          # Verify SukiSU_patch was cloned
          if [ -d "SukiSU_patch" ]; then
            echo "✓ SukiSU_patch repository verified" | tee -a error-log-${{ matrix.device }}.txt
            ls -la SukiSU_patch/ | tee -a error-log-${{ matrix.device }}.txt
          else
            echo "✗ ERROR: SukiSU_patch repository not found!" | tee -a error-log-${{ matrix.device }}.txt
            exit 1
          fi

          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Upgrade LZ4 to version 1.10.0 (Official Method)
        if: ${{ github.event.inputs.enable_zram == 'true' }}
        working-directory: kernel
        run: |
          echo "--- LZ4 1.10.0 Upgrade (Official Logic) ---" | tee -a ../error-log-${{ matrix.device }}.txt

          # 1. Clean old files
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c
          echo "Cleaned old LZ4 files" | tee -a ../error-log-${{ matrix.device }}.txt

          # 2. Copy new files
          cp -r ../zzh_patches/zram/lz4/* ./lib/lz4/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt
          cp -r ../zzh_patches/zram/include/linux/* ./include/linux/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt

          # 3. Apply Patch
          if [ -f "../zzh_patches/zram/${{ env.KERNEL_VERSION }}/lz4_1.10.0.patch" ]; then
            cp ../zzh_patches/zram/${{ env.KERNEL_VERSION }}/lz4_1.10.0.patch ./
            echo "Applying LZ4 1.10.0 patch..." | tee -a ../error-log-${{ matrix.device }}.txt
            if patch -p1 -F 3 --fuzz=5 < lz4_1.10.0.patch 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt; then
              echo "✓ LZ4 1.10.0 patch applied successfully" | tee -a ../error-log-${{ matrix.device }}.txt
            else
              echo "⚠ LZ4 1.10.0 patch had issues (continuing)" | tee -a ../error-log-${{ matrix.device }}.txt
            fi
          else
            echo "⚠ LZ4 1.10.0 patch not found for kernel ${{ env.KERNEL_VERSION }}" | tee -a ../error-log-${{ matrix.device }}.txt
          fi

          # 4. F2FS IOSTAT Fix
          if [ -f "fs/f2fs/Makefile" ]; then
              if ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
                  echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
                  echo "✓ Added F2FS iostat configuration" | tee -a ../error-log-${{ matrix.device }}.txt
              fi
          fi
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Clone Droidspaces patch repository
        if: ${{ github.event.inputs.droidspaces != 'off' }}
        run: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          echo "DROIDSPACES_PATCHES=/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI" >> $GITHUB_ENV

      - name: Add KernelSU variant
        working-directory: kernel
        run: |
          echo "--- Adding ${{ github.event.inputs.ksu_variant }} ---" | tee -a ../error-log-${{ matrix.device }}.txt

          if [ "${{ github.event.inputs.ksu_variant }}" == "ReSukiSU" ]; then
            SETUP_URL="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
            BRANCH="-s ${{ env.RESUKISU_PIN }}"
          else
            SETUP_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh"
            BRANCH="-s builtin"
          fi
          echo "Using setup: $SETUP_URL ($BRANCH)" | tee -a ../error-log-${{ matrix.device }}.txt

          if curl -LSs "$SETUP_URL" | bash $BRANCH 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt; then
            echo "✓ ${{ github.event.inputs.ksu_variant }} setup completed" | tee -a ../error-log-${{ matrix.device }}.txt
          else
            echo "✗ ERROR: ${{ github.event.inputs.ksu_variant }} setup failed!" | tee -a ../error-log-${{ matrix.device }}.txt
            exit 1
          fi

          if [ ! -d "KernelSU" ]; then
            echo "✗ ERROR: KernelSU directory not found!" | tee -a ../error-log-${{ matrix.device }}.txt
            exit 1
          else
            echo "✓ KernelSU directory verified" | tee -a ../error-log-${{ matrix.device }}.txt
          fi
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Add Baseband-guard support
        working-directory: kernel
        run: |
          LOG="../error-log-${{ matrix.device }}.txt"

          echo "--- Adding Baseband-guard ---" | tee -a "$LOG"
          # Run setup.sh
          if wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash 2>&1 | tee -a "$LOG"; then
            echo "✓ Baseband-guard setup script completed" | tee -a "$LOG"
          else
            echo "⚠ Baseband-guard setup had issues (continuing)" | tee -a "$LOG"
          fi

          echo "Enabling Baseband-guard kernel configuration..." | tee -a "$LOG"
          CONFIG_FILE="arch/arm64/configs/${{ matrix.device }}_defconfig"

          # Add CONFIG_BBG=y if not already present
          if grep -q '^CONFIG_BBG=y' "$CONFIG_FILE"; then
            echo "ℹ CONFIG_BBG=y already present" | tee -a "$LOG"
          else
            echo 'CONFIG_BBG=y' >> "$CONFIG_FILE"
            echo "✓ Added CONFIG_BBG=y to defconfig" | tee -a "$LOG"
          fi

          # Add LSM configuration to defconfig
          echo "Adding LSM configuration to defconfig..." | tee -a "$LOG"
          if grep -q "CONFIG_DEFAULT_SECURITY_SELINUX=y" "$CONFIG_FILE"; then
            echo 'CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> "$CONFIG_FILE"
            echo "✓ Added LSM config with SELinux default" | tee -a "$LOG"
          else
            echo 'CONFIG_LSM="landlock,lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> "$CONFIG_FILE"
            echo "✓ Added default LSM config" | tee -a "$LOG"
          fi

          echo "✓ Baseband-guard configuration completed" | tee -a "$LOG"
          echo "" >> "$LOG"

      - name: Verify SUSFS patch files exist
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        run: |
          echo "--- SUSFS Patch Verification ---" | tee -a error-log-${{ matrix.device }}.txt
          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "✗ ERROR: SUSFS patch not found: $PATCH_FILE" | tee -a error-log-${{ matrix.device }}.txt
            exit 1
          else
            echo "✓ Found SUSFS patch: $PATCH_FILE" | tee -a error-log-${{ matrix.device }}.txt
          fi
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Apply SUSFS patches for SukiSU
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        working-directory: kernel
        run: |
          echo "--- SUSFS Patch Application ---" | tee -a ../error-log-${{ matrix.device }}.txt

          # Copy main SUSFS patch
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt

          # Copy SUSFS filesystem files
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt

          # Copy SUSFS include files
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt

          # Apply main SUSFS patch
          echo "Applying main SUSFS patch..." | tee -a ../error-log-${{ matrix.device }}.txt
          if patch -p1 --fuzz=3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt; then
            echo "✓ Main SUSFS patch applied successfully" | tee -a ../error-log-${{ matrix.device }}.txt
          else
            echo "⚠ Main SUSFS patch had issues (continuing)" | tee -a ../error-log-${{ matrix.device }}.txt
          fi
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Integrate Droidspaces support
        if: ${{ github.event.inputs.droidspaces != 'off' }}
        working-directory: kernel
        run: |
          LOG="../error-log-${{ matrix.device }}.txt"
          KERNEL_VER="${{ env.KERNEL_VERSION }}"
          SLOT="${{ github.event.inputs.droidspaces }}"

          # 678 -> 6_7_8, 123 -> 1_2_3, 345 -> 3_4_5
          SLOT_NAME=$(echo "$SLOT" | sed 's/\(.\)/\1_/g; s/_$//')
          echo "--- Droidspaces Integration ---" | tee -a "$LOG"
          echo "Using Droidspaces slot patch: $SLOT / $SLOT_NAME" | tee -a "$LOG"

          case "$KERNEL_VER" in
            6.12)
              PATCH_FILE="$DROIDSPACES_PATCHES/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
              ;;
            5.10|5.15|6.1|6.6)
              PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"
              ;;
            *)
              echo "⚠ Droidspaces: unsupported kernel version $KERNEL_VER; skipping patch" | tee -a "$LOG"
              exit 0
              ;;
          esac

          if [ ! -f "$PATCH_FILE" ]; then
            echo "✗ ERROR: Droidspaces patch not found: $PATCH_FILE" | tee -a "$LOG"
            exit 1
          fi

          if patch -p1 --forward < "$PATCH_FILE" 2>&1 | tee -a "$LOG"; then
            echo "✓ Droidspaces SYSVIPC kABI patch applied" | tee -a "$LOG"
          else
            echo "⚠ Droidspaces SYSVIPC kABI patch failed or was already applied (continuing)" | tee -a "$LOG"
          fi

          if [ "$KERNEL_VER" = "5.10" ]; then
            POSIX_PATCH="$DROIDSPACES_PATCHES/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
            if patch -p1 --forward < "$POSIX_PATCH" 2>&1 | tee -a "$LOG"; then
              echo "✓ Droidspaces POSIX_MQUEUE kABI patch applied" | tee -a "$LOG"
            else
              echo "⚠ Droidspaces POSIX_MQUEUE kABI patch failed or was already applied (continuing)" | tee -a "$LOG"
            fi
          fi

          DEFCONFIG="arch/arm64/configs/${{ matrix.device }}_defconfig"
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  already enabled: $cfg" | tee -a "$LOG"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  enabled: $cfg" | tee -a "$LOG"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  added: $cfg" | tee -a "$LOG"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  not defined by this kernel, skipped: $cfg" | tee -a "$LOG"
            fi
          }

          echo "Adding Droidspaces kernel configuration..." | tee -a "$LOG"
          enable_config CONFIG_SYSVIPC
          enable_config CONFIG_POSIX_MQUEUE
          enable_config CONFIG_IPC_NS
          enable_config CONFIG_PID_NS
          enable_config CONFIG_DEVTMPFS

          # Optional networking support used by Droidspaces container networking/NAT modes.
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
          enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT
          enable_config_if_defined CONFIG_IP_SET
          enable_config_if_defined CONFIG_IP_SET_HASH_IP
          enable_config_if_defined CONFIG_IP_SET_HASH_NET
          enable_config_if_defined CONFIG_NETFILTER_XT_SET
          enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
          enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT

          echo "✓ Droidspaces integration completed" | tee -a "$LOG"
          echo "" >> "$LOG"

      - name: Inject Droidspaces NTSync support
        if: ${{ github.event.inputs.droidspaces != 'off' && github.event.inputs.droidspaces_ntsync == 'true' }}
        working-directory: kernel
        run: |
          LOG="../error-log-${{ matrix.device }}.txt"
          echo "--- Droidspaces NTSync Integration ---" | tee -a "$LOG"

          case "${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}" in
            android12-5.10)
              NTSYNC_PATCH="ntsync_compat_android12-5.10"
              ;;
            android13-5.15)
              NTSYNC_PATCH="ntsync_compat_android13-5.15"
              ;;
            android14-6.1)
              NTSYNC_PATCH="ntsync_compat_android14-6.1"
              ;;
            android15-6.6)
              NTSYNC_PATCH="ntsync_compat_android15-6.6"
              ;;
            android16-6.12)
              NTSYNC_PATCH="ntsync_compat_android16-6.12"
              ;;
            *)
              echo "⚠ NTSync: unsupported ${{ env.ANDROID_VERSION }} / ${{ env.KERNEL_VERSION }}; skipping" | tee -a "$LOG"
              exit 0
              ;;
          esac

          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/ntsync_base.patch"
          wget -q "https://raw.githubusercontent.com/Goldzxcbug/Droidspaces_Kernel_patch/refs/heads/main/NTsync/${NTSYNC_PATCH}.patch"

          patch -p1 --forward < "ntsync_base.patch" 2>&1 | tee -a "$LOG"
          patch -p1 --forward < "${NTSYNC_PATCH}.patch" 2>&1 | tee -a "$LOG"

          DEFCONFIG="arch/arm64/configs/${{ matrix.device }}_defconfig"
          sed -i '/CONFIG_NTSYNC is not set/d' "$DEFCONFIG"
          if ! grep -q '^CONFIG_NTSYNC=y' "$DEFCONFIG"; then
            echo 'CONFIG_NTSYNC=y' >> "$DEFCONFIG"
          fi
          echo "✓ Droidspaces NTSync integration completed" | tee -a "$LOG"
          echo "" >> "$LOG"

      - name: Apply task_mmu.c fix for android13-5.15
        working-directory: kernel
        run: |
          echo "--- Applying task_mmu.c Fix ---" | tee -a ../error-log-${{ matrix.device }}.txt
          # Apply the fix if needed
          if grep -qxF $'\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            # Remove the unused label to fix -Werror=unused-label
            sed -i '/show_pad:/d' ./fs/proc/task_mmu.c
            echo "✓ Applied task_mmu.c fix (replaced 'goto show_pad' with 'return 0' and removed label)" | tee -a ../error-log-${{ matrix.device }}.txt
          else
            echo "ℹ task_mmu.c doesn't need fixing" | tee -a ../error-log-${{ matrix.device }}.txt
          fi
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Apply ZRAM optimizations (LZ4KD - Official Method)
        if: ${{ github.event.inputs.enable_zram == 'true' }}
        working-directory: kernel
        run: |
          echo "--- ZRAM LZ4KD Optimization ---" | tee -a ../error-log-${{ matrix.device }}.txt

          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto/ 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt

          if [ -f "../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch" ]; then
            cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
            echo "Applying lz4kd patch..." | tee -a ../error-log-${{ matrix.device }}.txt
            if patch -p1 -F 3 < lz4kd.patch 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt; then
              echo "✓ lz4kd patch applied successfully" | tee -a ../error-log-${{ matrix.device }}.txt
            else
              echo "⚠ lz4kd patch had issues (continuing)" | tee -a ../error-log-${{ matrix.device }}.txt
            fi
          fi
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Configure kernel features
        working-directory: kernel
        run: |
          echo "--- Kernel Configuration ---" | tee -a ../error-log-${{ matrix.device }}.txt

          DEFCONFIG="arch/arm64/configs/${{ matrix.device }}_defconfig"
          echo "Using defconfig: $DEFCONFIG" | tee -a ../error-log-${{ matrix.device }}.txt

          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          if [ "${{ github.event.inputs.enable_kpm }}" == "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          fi
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$DEFCONFIG"

          if [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
          fi

          if [ "${{ github.event.inputs.enable_zram }}" == "true" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG"
            echo "CONFIG_ZRAM=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$DEFCONFIG"
            echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_842=y" >> "$DEFCONFIG"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$DEFCONFIG"
            echo "CONFIG_CRYPTO_LZO=y" >> "$DEFCONFIG"
          fi

          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$DEFCONFIG"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$DEFCONFIG"
          echo "✓ Kernel configuration completed" | tee -a ../error-log-${{ matrix.device }}.txt
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Update kernel version string
        working-directory: kernel
        run: |
          echo "--- Kernel Version String ---" | tee -a ../error-log-${{ matrix.device }}.txt
          DEFCONFIG="arch/arm64/configs/${{ matrix.device }}_defconfig"
          FEATURES="${{ env.KERNEL_LOCALVERSION }}"
          if [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
            FEATURES="${FEATURES}-SUSFS"
          fi
          if [ "${{ github.event.inputs.enable_kpm }}" == "true" ]; then
            FEATURES="${FEATURES}-KPM"
          fi

          # Set version via defconfig - disable auto and set full string
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' "$DEFCONFIG"
          sed -i "s|CONFIG_LOCALVERSION=\".*\"|CONFIG_LOCALVERSION=\"-${FEATURES}\"|" "$DEFCONFIG"
          # Remove -dirty suffix from setlocalversion
          sed -i "s/printf '%s' -dirty/# dirty check disabled/" scripts/setlocalversion
          echo "✓ Kernel version: -${FEATURES}" | tee -a ../error-log-${{ matrix.device }}.txt
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Configure git for clean build
        working-directory: kernel
        run: |
          echo "--- Git Configuration ---" | tee -a ../error-log-${{ matrix.device }}.txt
          git config --global user.email "spacealtctrl@pm.me"
          git config --global user.name "spacealtctrl"
          rm -rf .gitmodules 2>/dev/null || true
          git rm --cached KernelSU 2>/dev/null || true

          git add .
          if git commit -m "Applied SukiSU patches and configurations" 2>&1 | tee -a ../error-log-${{ matrix.device }}.txt; then
            echo "✓ Git commit successful" | tee -a ../error-log-${{ matrix.device }}.txt
          else
            echo "ℹ Git commit not needed or failed (continuing)" | tee -a ../error-log-${{ matrix.device }}.txt
          fi
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Optimize ccache
        run: |
          echo "--- Ccache Optimization ---" | tee -a error-log-${{ matrix.device }}.txt
          ccache -M 3G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache --set-config=max_size=3G
          ccache --set-config=sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "CCACHE_HARDLINK=true" >> $GITHUB_ENV
          echo "✓ Ccache configured" | tee -a error-log-${{ matrix.device }}.txt
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Pre-build Setup
        run: |
          echo "--- Pre-build Setup ---" | tee -a error-log-${{ matrix.device }}.txt
          sudo mkdir -p /mnt/tmpfs
          sudo mount -t tmpfs -o size=10G tmpfs /mnt/tmpfs
          mkdir -p /mnt/tmpfs/out
          ln -sf /mnt/tmpfs/out kernel/out
          echo "✓ tmpfs mounted and linked" | tee -a error-log-${{ matrix.device }}.txt
          df -h | tee -a error-log-${{ matrix.device }}.txt
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Build kernel
        working-directory: kernel
        env:
          MAKE_ARGS:
            O=out LLVM=1 LLVM_IAS=1 ARCH=arm64
            -j$(nproc --all) CC="ccache clang"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS="-Wframe-larger-than=15000"
        run: |
          echo "--- Kernel Build ---" | tee -a ../error-log-${{ matrix.device }}.txt
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export PAHOLE=/usr/bin/pahole
          export BTF_DEBUG_INFO=y
          echo "Building with $(nproc --all) parallel jobs..." | tee -a ../error-log-${{ matrix.device }}.txt
          echo "Build started: $(date -u)" | tee -a ../error-log-${{ matrix.device }}.txt

          # Generate defconfig and prepare headers (flask.h etc) before full parallel build
          make ${{ env.MAKE_ARGS }} ${{ matrix.device }}_defconfig 2>&1 | tee build.log
          make ${{ env.MAKE_ARGS }} prepare 2>&1 | tee -a build.log

          if make ${{ env.MAKE_ARGS }} all 2>&1 | tee -a build.log; then
            echo "✓ Kernel build completed successfully" | tee -a ../error-log-${{ matrix.device }}.txt
          else
            echo "✗ ERROR: Kernel build failed!" | tee -a ../error-log-${{ matrix.device }}.txt
            echo "Last 100 lines of build output:" | tee -a ../error-log-${{ matrix.device }}.txt
            tail -100 build.log | tee -a ../error-log-${{ matrix.device }}.txt
            exit 1
          fi
          echo "Build completed: $(date -u)" | tee -a ../error-log-${{ matrix.device }}.txt
          echo "" >> ../error-log-${{ matrix.device }}.txt

      - name: Verify kernel build
        run: |
          echo "--- Build Verification ---" | tee -a error-log-${{ matrix.device }}.txt
          echo "Verifying kernel build..."
          if [ ! -f "kernel/out/arch/arm64/boot/Image" ]; then
            echo "✗ ERROR: Kernel Image not found! Build failed." | tee -a error-log-${{ matrix.device }}.txt
            exit 1
          fi
          echo "✓ Build verified successfully:" | tee -a error-log-${{ matrix.device }}.txt
          ls -lh kernel/out/arch/arm64/boot/Image | tee -a error-log-${{ matrix.device }}.txt
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Apply KPM patch (Official Method)
        if: ${{ github.event.inputs.enable_kpm == 'true' }}
        run: |
          echo "--- KPM Patch Application (Official Method) ---" | tee -a error-log-${{ matrix.device }}.txt

          # Apply patch
          cd kernel/out/arch/arm64/boot/
          echo "Downloading patch_linux..." | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod 777 patch_linux

          echo "Running patch_linux..." | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt
          if ./patch_linux 2>&1 | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt; then
            echo "✓ KPM patch applied successfully" | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt
          else
            echo "✗ ERROR: KPM patch application failed" | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt
            exit 1
          fi

          rm -rf Image
          mv oImage Image

          if [ -f "Image" ]; then
            echo "✓ Patched Image verified" | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt
          else
            echo "✗ ERROR: Patched Image not found" | tee -a $GITHUB_WORKSPACE/error-log-${{ matrix.device }}.txt
            exit 1
          fi
          cd ../../../../..
          echo "" >> error-log-${{ matrix.device }}.txt

      - name: Log build configuration
        run: |
          echo "=== Build Configuration Summary ===" | tee build-info-${{ matrix.device }}.txt
          echo "Device: ${{ matrix.device }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "KernelSU Variant: ${{ github.event.inputs.ksu_variant }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "SUSFS Enabled: ${{ github.event.inputs.enable_susfs }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "KPM Enabled: ${{ github.event.inputs.enable_kpm }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "ZRAM/LZ4KD Enabled: ${{ github.event.inputs.enable_zram }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "Droidspaces: ${{ github.event.inputs.droidspaces }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "Droidspaces NTSync: ${{ github.event.inputs.droidspaces_ntsync }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "Release Version: ${{ github.event.inputs.release_version }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "Build Date: $(date -u)" | tee -a build-info-${{ matrix.device }}.txt
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "Android Version: ${{ env.ANDROID_VERSION }}" | tee -a build-info-${{ matrix.device }}.txt
          echo "Clang Version: ${{ env.AOSP_CLANG_VERSION }}" | tee -a build-info-${{ matrix.device }}.txt

          # Extract SUSFS version from build log
          if [ -f "kernel/build.log" ]; then
            SUSFS_VER=$(grep -oP "SUSFS_VERSION: \Kv[0-9]+\.[0-9]+\.[0-9]+" kernel/build.log | head -1 || echo "unknown")
            echo "SUSFS_VERSION: $SUSFS_VER" | tee -a build-info-${{ matrix.device }}.txt
          fi

          echo "===================================" | tee -a build-info-${{ matrix.device }}.txt
          echo "" | tee -a build-info-${{ matrix.device }}.txt

          # Append complete error log
          if [ -f "error-log-${{ matrix.device }}.txt" ]; then
            cat error-log-${{ matrix.device }}.txt >> build-info-${{ matrix.device }}.txt
          fi

          # Add build warnings and errors summary
          if [ -f "kernel/build.log" ]; then
            echo "" >> build-info-${{ matrix.device }}.txt
            echo "=== Build Warnings Summary ===" >> build-info-${{ matrix.device }}.txt
            grep -i "warning:" kernel/build.log >> build-info-${{ matrix.device }}.txt || echo "No warnings found" >> build-info-${{ matrix.device }}.txt
            echo "" >> build-info-${{ matrix.device }}.txt
            echo "=== Build Errors Summary ===" >> build-info-${{ matrix.device }}.txt
            grep -i "error:" kernel/build.log >> build-info-${{ matrix.device }}.txt || echo "No errors found" >> build-info-${{ matrix.device }}.txt
          fi

          echo "" >> build-info-${{ matrix.device }}.txt
          echo "=== Summary Statistics ===" >> build-info-${{ matrix.device }}.txt
          if [ -f "error-log-${{ matrix.device }}.txt" ]; then
            SUCCESS=$(grep -c "✓" error-log-${{ matrix.device }}.txt || echo "0")
            WARNINGS=$(grep -c "⚠" error-log-${{ matrix.device }}.txt || echo "0")
            ERRORS=$(grep -c "✗" error-log-${{ matrix.device }}.txt || echo "0")
            echo "Successful operations: $SUCCESS" >> build-info-${{ matrix.device }}.txt
            echo "Warnings: $WARNINGS" >> build-info-${{ matrix.device }}.txt
            echo "Errors: $ERRORS" >> build-info-${{ matrix.device }}.txt
          fi
          echo "===================================" >> build-info-${{ matrix.device }}.txt

      - name: Save ccache stats
        if: always()
        run: |
          ccache -s
          echo "Ccache statistics saved"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 AnyKernel3-${{ matrix.device }}

          cp kernel/out/arch/arm64/boot/Image AnyKernel3-${{ matrix.device }}/

          cd AnyKernel3-${{ matrix.device }}
          zip -r9 -q "../AnyKernel3-${{ matrix.device }}-${{ env.BUILD_SLUG }}.zip" * -x .git .github README.md *placeholder
          cd ..

      - name: Copy kernel Image for upload
        run: |
          cp kernel/out/arch/arm64/boot/Image Image-${{ matrix.device }}

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}-${{ env.BUILD_SLUG }}
          path: |
            AnyKernel3-${{ matrix.device }}-${{ env.BUILD_SLUG }}.zip
            Image-${{ matrix.device }}
            build-info-${{ matrix.device }}.txt
          overwrite: true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: success()
    permissions:
      contents: write
    env:
      BUILD_SLUG: ${{ github.event.inputs.ksu_variant == 'ReSukiSU' && 'resukisu' || 'sukisu' }}
    steps:
      - name: Download build artifacts for pdx234
        uses: actions/download-artifact@v4
        with:
          name: kernel-pdx234-${{ env.BUILD_SLUG }}
          path: artifacts/pdx234

      - name: Prepare release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets

          cp artifacts/pdx234/Image-pdx234 release-assets/Image-pdx234
          cp artifacts/pdx234/build-info-pdx234.txt release-assets/build-info-pdx234.txt
          cp artifacts/pdx234/AnyKernel3-pdx234-*.zip release-assets/

          if [ "${{ github.event.inputs.ksu_variant }}" == "ReSukiSU" ]; then
            MGR_REPO="ReSukiSU/ReSukiSU"
            MGR_ARTIFACT="Manager-release"
          else
            MGR_REPO="SukiSU-Ultra/SukiSU-Ultra"
            MGR_ARTIFACT="manager"
          fi
          echo "Fetching '$MGR_ARTIFACT' from $MGR_REPO build-manager.yml artifacts (latest build, matches compiled kernel)..."

          MGR_FOUND=""
          RUN_IDS=$(gh api "repos/$MGR_REPO/actions/workflows/build-manager.yml/runs?status=success&per_page=10" -q '.workflow_runs[].id' 2>/dev/null || echo "")
          for RUN_ID in $RUN_IDS; do
            HAS_ART=$(gh api "repos/$MGR_REPO/actions/runs/$RUN_ID/artifacts" -q ".artifacts[] | select(.name==\"$MGR_ARTIFACT\") | .name" 2>/dev/null | head -1 || true)
            [ -z "$HAS_ART" ] && continue
            rm -rf manager-dl
            if gh run download "$RUN_ID" -R "$MGR_REPO" -n "$MGR_ARTIFACT" -D manager-dl 2>/dev/null; then
              APK_PATH=$(find manager-dl -name "*.apk" 2>/dev/null | head -1 || true)
              if [ -n "$APK_PATH" ]; then
                cp "$APK_PATH" "release-assets/$(basename "$APK_PATH")"
                echo "Manager (run $RUN_ID): $(basename "$APK_PATH")"
                MGR_FOUND=1
                break
              fi
            fi
          done
          [ -z "$MGR_FOUND" ] && echo "WARNING: manager APK not found in recent $MGR_REPO build-manager runs, skipping"

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Generate release tag and notes
        id: release_info
        run: |
          TAG="pdx234-${{ github.ref_name }}-${{ github.event.inputs.release_version }}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          SUSFS_VERSION="v2.1.0"
          if [ -f "artifacts/pdx234/build-info-pdx234.txt" ]; then
            EXTRACTED=$(grep -oP "SUSFS_VERSION: \Kv[0-9]+\.[0-9]+\.[0-9]+" artifacts/pdx234/build-info-pdx234.txt | head -1 || echo "")
            if [ -n "$EXTRACTED" ]; then
              SUSFS_VERSION="$EXTRACTED"
            fi
          fi

          VARIANT="${{ github.event.inputs.ksu_variant }}"
          if [ "$VARIANT" == "ReSukiSU" ]; then
            VARIANT_FEATURE="ReSukiSU (pinned ${RESUKISU_PIN:0:7} - last build with KPM)"
            MANAGER_REPO="https://github.com/ReSukiSU/ReSukiSU"
          else
            VARIANT_FEATURE="SukiSU (builtin)"
            MANAGER_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
          fi

          DROIDSPACES_FEATURE="disabled"
          if [ "${{ github.event.inputs.droidspaces }}" != "off" ]; then
            DROIDSPACES_FEATURE="enabled (slot ${{ github.event.inputs.droidspaces }}"
            if [ "${{ github.event.inputs.droidspaces_ntsync }}" == "true" ]; then
              DROIDSPACES_FEATURE="${DROIDSPACES_FEATURE}, NTSync"
            fi
            DROIDSPACES_FEATURE="${DROIDSPACES_FEATURE})"
          fi

          RELEASE_NAME="pdx234 Kernel: ${VARIANT} & SUSFS ${SUSFS_VERSION}"
          echo "RELEASE_NAME<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NAME" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          cat > release-notes.md << EOF
          This release includes **${VARIANT}** for Sony Xperia devices on LineageOS 23.2 / crDroid 12.11

          ## Supported Devices:
          - **pdx234** - Sony Xperia 1 V

          Features:
          -> ${VARIANT_FEATURE}
          -> SUSFS ඞ ${SUSFS_VERSION}
          -> Inline Hook
          -> Baseband-guard Support
          -> BBR Support
          -> KPM ${{ github.event.inputs.enable_kpm == 'true' && 'Support' || 'not supported' }}
          -> LZ4KD ${{ github.event.inputs.enable_zram == 'true' && 'supported' || 'not supported' }}
          -> LZ4 1.10.0 ${{ github.event.inputs.enable_zram == 'true' && 'supported' || 'not supported' }}
          -> Droidspaces container support: ${DROIDSPACES_FEATURE}

          <details>
          <summary>▸ Notes:</summary>

          - Device specific builds for Sony Xperia with SM8550
          - Based on LineageOS 23.2 kernel source (Android 13 base)
          - In the latest version of susfs, flashing AK3 with Kernel Flasher may brick your device, try [Horizon Kernel Flasher](https://github.com/libxzr/HorizonKernelFlasher)
          - Flash the AnyKernel3 zip that matches your device model
          - Droidspaces support is experimental; if the build fails or the device bootloops, rerun with a different slot patch (678, 123, or 345).

          </details>

          ## Downloads:
          - **pdx234 (Xperia 1 V)**: AnyKernel3-pdx234-*.zip

          Modules:
          -> https://github.com/sidex15/ksu_module_susfs

          Manager:
          -> ${MANAGER_REPO}

          Droidspaces: Official patches from [Droidspaces-OSS](https://github.com/ravindu644/Droidspaces-OSS/tree/main/Documentation/resources/kernel-patches/GKI)

          LZ4 1.10.0: Upgrade from [zzh20188/GKI_KernelSU_SUSFS](https://github.com/zzh20188/GKI_KernelSU_SUSFS)

          <details>
          <summary>▸ Commit Information</summary>

          Build compiled with:
          - **KernelSU Variant**: ${VARIANT}
          - **Devices**: Sony Xperia 1 V (pdx234)
          - **Base Kernel**: 5.15
          - **Android Version**: 16 (LineageOS 23.2 - crDroid 12.11)
          - **Clang Version**: ${{ env.AOSP_CLANG_VERSION }}
          - **Release Version**: ${{ github.event.inputs.release_version }}
          - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Workflow Run**: [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          </details>
          EOF

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || {
            sudo apt update
            sudo apt install -y gh
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.RELEASE_NAME }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            release-assets/*

      - name: Output release URL
        run: |
          echo "Release created successfully!"
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
          echo "Devices included: pdx234 (Xperia 1 V)"
